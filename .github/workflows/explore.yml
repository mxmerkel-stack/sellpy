name: Sellpy-Abruf testen (Einrichtung)

# Nur für die Einrichtung: startet bei Änderungen an explore/trigger.txt oder per "Run workflow".
on:
  push:
    paths:
      - explore/trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Daten bei Sellpy abrufen
        env:
          SELLPY_USER: ${{ secrets.SELLPY_USER }}
          SELLPY_PASS: ${{ secrets.SELLPY_PASS }}
          PAGE_PASSWORD: einmaliger-testlauf-ohne-verlauf
        run: python scripts/fetch_sellpy.py
      - name: Ergebnis verschlüsselt ausgeben
        run: python scripts/dump_for_claude.py data/sellpy.json
