name: Dashboard aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"     # täglich ~06:17 Uhr (MEZ)
    - cron: "47 18 * * *"    # täglich ~19:47 Uhr (MEZ)
  workflow_dispatch:          # Knopf "Run workflow" für ein Update von Hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_DIR: data
      DIST_DIR: dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Verlauf laden (verschlüsselt)
        uses: actions/cache/restore@v4
        with:
          path: data/history.enc
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Sellpy-Mails aus Gmail lesen
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python scripts/fetch_gmail.py

      - name: Verlauf speichern (verschlüsselt)
        uses: actions/cache/save@v4
        with:
          path: data/history.enc
          key: history-${{ github.run_id }}

      - name: Seite bauen und verschlüsseln
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          python scripts/build_site.py
          python scripts/encrypt_page.py
          rm -f data/sales.json data/events.json
          touch dist/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
