name: Einrichtung – Käufe erkunden (temporär)
on:
  push:
    paths: [scripts/probe_orders.py, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - env:
          SELLPY_USER: ${{ secrets.SELLPY_USER }}
          SELLPY_PASS: ${{ secrets.SELLPY_PASS }}
        run: python scripts/probe_orders.py && python scripts/dump_for_claude.py probe.json
