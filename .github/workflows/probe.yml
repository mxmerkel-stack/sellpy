name: Einrichtung – Favoriten finden 5 (temporär)
on:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - env:
          SELLPY_USER: ${{ secrets.SELLPY_USER }}
          SELLPY_PASS: ${{ secrets.SELLPY_PASS }}
          PAGE_PASSWORD: einmaliger-testlauf-ohne-verlauf
        run: python scripts/probe_fav.py && python scripts/dump_for_claude.py data/probe.json
